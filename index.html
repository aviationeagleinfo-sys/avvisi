<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Eagle - Portale Avvisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%);
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        /* Effetto Liquid Glass (Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .glass-input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-gray-800">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-plane-shield text-blue-500 text-2xl"></i>
            <span class="font-bold text-lg tracking-wider text-white">AVIATION EAGLE</span>
            <span class="text-xs bg-gray-800 text-gray-400 px-2 py-0.5 rounded-full border border-gray-700">Operations</span>
        </div>
        <div class="flex items-center space-x-6">
            <a href="https://news.aviationeagle.co.uk" target="_blank" class="text-sm font-medium text-gray-300 hover:text-blue-400 transition-colors flex items-center space-x-1">
                <i class="fa-solid fa-newspaper text-xs"></i>
                <span>Comunicati Stampa</span>
            </a>
            <div id="auth-status-container" class="flex items-center space-x-3">
                <button id="btn-show-login" class="text-sm bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-all font-medium">
                    Accedi
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">

        <div id="login-panel" class="hidden max-w-md mx-auto glass-panel p-6 rounded-2xl shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-lock text-blue-500"></i> Autenticazione Operativa
                </h3>
                <button id="btn-close-login" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Email</label>
                    <input type="email" id="login-email" required class="w-full p-2.5 rounded-lg glass-input text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full p-2.5 rounded-lg glass-input text-sm">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-lg font-medium text-sm transition-colors">
                    Verifica Credenziali
                </button>
            </form>
        </div>

        <div id="admin-panel" class="hidden glass-panel p-6 rounded-2xl border-l-4 border-l-blue-500 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold tracking-wide text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-blue-500"></i> Console Amministrazione Avvisi
                </h2>
                <span class="text-xs bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full border border-blue-500/30 font-mono">ADMIN MODE</span>
            </div>
            
            <form id="notice-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="hidden" id="notice-id"> 
                
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Titolo dell'Avviso</label>
                    <input type="text" id="notice-title" required class="w-full p-2.5 rounded-lg glass-input text-sm" placeholder="Es: Sospensione voli temporanea NOTAM...">
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Tipologia</label>
                    <select id="notice-type" class="w-full p-2.5 rounded-lg glass-input text-sm bg-gray-900">
                        <option value="Operativo">Operativo</option>
                        <option value="Meteo">Meteo / NOTAM</option>
                        <option value="Flotta">Flotta & Network</option>
                        <option value="Generale">Generale</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Corpo del Messaggio / Dettagli</label>
                    <textarea id="notice-body" required rows="3" class="w-full p-2.5 rounded-lg glass-input text-sm" placeholder="Inserisci i dettagli operativi completi..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Livello di Importanza</label>
                    <select id="notice-severity" class="w-full p-2.5 rounded-lg glass-input text-sm bg-gray-900">
                        <option value="Low">Bassa (Info / Routine)</option>
                        <option value="Medium">Media (Attenzione Richiesta)</option>
                        <option value="High">Alta (Criticità / Urgente)</option>
                    </select>
                </div>

                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Link Correlato / Documentazione (Opzionale)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500 text-sm">
                            <i class="fa-solid fa-link"></i>
                        </span>
                        <input type="url" id="notice-link" class="w-full p-2.5 pl-9 rounded-lg glass-input text-sm" placeholder="https://example.com/dettagli-operativi">
                    </div>
                </div>

                <div class="md:col-span-3 flex justify-end space-x-2 pt-2">
                    <button type="button" id="btn-cancel-edit" class="hidden bg-gray-700 hover:bg-gray-600 text-white px-5 py-2.5 rounded-lg font-medium text-sm transition-colors">
                        Annulla
                    </button>
                    <button type="submit" id="btn-submit-notice" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-lg font-medium text-sm transition-colors">
                        Pubblica Avviso
                    </button>
                </div>
            </form>
        </div>

        <div class="space-y-4">
            <h2 class="text-xl font-bold tracking-wide text-white flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation text-amber-500"></i> Feed Avvisi Attivi
            </h2>
            <div id="notices-feed" class="grid grid-cols-1 gap-4">
                <div class="text-center py-12 text-gray-500 text-sm">
                    <i class="fa-solid fa-spinner animate-spin text-2xl mb-2"></i>
                    <p>Sincronizzazione con il database di rete in corso...</p>
                </div>
            </div>
        </div>

    </main>

    <footer class="glass-panel mt-auto py-4 text-center text-xs text-gray-500 border-t border-gray-800">
        &copy; 2026 Aviation Eagle Network. Tutti i diritti riservati. Monitoraggio Operativo.
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3FP3zjoGUAxk0OK3U_ljGkefP5s2KeDc",
            authDomain: "avvisi-ae.firebaseapp.com",
            projectId: "avvisi-ae",
            storageBucket: "avvisi-ae.firebasestorage.app",
            messagingSenderId: "399548092395",
            appId: "1:399548092395:web:2e8516d2c9ad8781df53ae"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const adminWhitelist = ["aviationeagle.info@gmail.com", "avvisi.aviationeagle@gmail.com"];
        let currentAdminState = false;

        const loginPanel = document.getElementById('login-panel');
        const adminPanel = document.getElementById('admin-panel');
        const btnShowLogin = document.getElementById('btn-show-login');
        const btnCloseLogin = document.getElementById('btn-close-login');
        const loginForm = document.getElementById('login-form');
        const authStatusContainer = document.getElementById('auth-status-container');
        const noticeForm = document.getElementById('notice-form');
        const noticesFeed = document.getElementById('notices-feed');
        const btnSubmitNotice = document.getElementById('btn-submit-notice');
        const btnCancelEdit = document.getElementById('btn-cancel-edit');

        btnShowLogin.addEventListener('click', () => loginPanel.classList.toggle('hidden'));
        btnCloseLogin.addEventListener('click', () => loginPanel.classList.add('hidden'));

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                loginForm.reset();
                loginPanel.classList.add('hidden');
            } catch (error) {
                alert("Errore di autenticazione: " + error.message);
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user && adminWhitelist.includes(user.email.toLowerCase())) {
                currentAdminState = true;
                adminPanel.classList.remove('hidden');
                
                authStatusContainer.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-xs text-green-400 font-mono hidden md:inline"><i class="fa-solid fa-user-shield"></i> ${user.email}</span>
                        <button id="btn-logout" class="text-sm bg-red-950/40 hover:bg-red-900 border border-red-800 text-red-200 px-3 py-1.5 rounded-lg transition-all">
                            Disconnetti
                        </button>
                    </div>
                `;
                document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));
            } else {
                currentAdminState = false;
                adminPanel.classList.add('hidden');
                resetForm();
                authStatusContainer.innerHTML = `
                    <button id="btn-show-login" class="text-sm bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-all font-medium">
                        Accedi
                    </button>
                `;
                document.getElementById('btn-show-login').addEventListener('click', () => loginPanel.classList.toggle('hidden'));
                if (user) {
                    alert("Account non presente nella whitelist degli amministratori.");
                    signOut(auth);
                }
            }
            loadNotices();
        });

        // Invio o Modifica (Inclusione campo link)
        noticeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const noticeId = document.getElementById('notice-id').value;
            const title = document.getElementById('notice-title').value;
            const type = document.getElementById('notice-type').value;
            const body = document.getElementById('notice-body').value;
            const severity = document.getElementById('notice-severity').value;
            const link = document.getElementById('notice-link').value.trim();

            const noticeData = {
                title: title,
                type: type,
                body: body,
                severity: severity,
                link: link || "", // Salva stringa vuota se non presente
                timestamp: new Date().getTime()
            };

            try {
                if (noticeId) {
                    const docRef = doc(db, "avvisi", noticeId);
                    await updateDoc(docRef, noticeData);
                } else {
                    await addDoc(collection(db, "avvisi"), noticeData);
                }
                resetForm();
            } catch (error) {
                alert("Errore nel salvataggio dei dati su Firestore: " + error.message);
            }
        });

        function loadNotices() {
            const q = query(collection(db, "avvisi"), orderBy("timestamp", "desc"));
            
            onSnapshot(q, (snapshot) => {
                noticesFeed.innerHTML = "";
                
                if (snapshot.empty) {
                    noticesFeed.innerHTML = `
                        <div class="glass-panel p-8 rounded-xl text-center text-gray-500 text-sm">
                            Nessun avviso operativo registrato al momento.
                        </div>
                    `;
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const id = doc.id;
                    const dateStr = new Date(data.timestamp).toLocaleString('it-IT', { timeZone: 'Europe/Rome' });
                    const hasLink = data.link && data.link !== "";
                    
                    let severityColor = "border-l-gray-500 text-gray-400 bg-gray-500/10";
                    let severityBadge = "bg-gray-800 text-gray-300";
                    if (data.severity === "Medium") {
                        severityColor = "border-l-amber-500 text-amber-400 bg-amber-500/5";
                        severityBadge = "bg-amber-950/40 text-amber-400 border border-amber-800/50";
                    } else if (data.severity === "High") {
                        severityColor = "border-l-red-500 text-red-400 bg-red-500/5 shadow-[inset_0_0_15px_rgba(239,68,68,0.05)]";
                        severityBadge = "bg-red-950/50 text-red-400 border border-red-800/50 animate-pulse";
                    }

                    // Sezione pulsante link esterno (se inserito)
                    let linkButtonHtml = "";
                    if (hasLink) {
                        linkButtonHtml = `
                            <div class="mt-3">
                                <a href="${escapeHtml(data.link)}" target="_blank" class="inline-flex items-center space-x-2 text-xs font-semibold bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 border border-blue-500/30 px-3 py-1.5 rounded-lg transition-all">
                                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                    <span>Apri Documentazione / Dettagli</span>
                                </a>
                            </div>
                        `;
                    }

                    // Pulsanti Azioni Admin
                    let adminActions = "";
                    if (currentAdminState) {
                        adminActions = `
                            <div class="flex space-x-2 mt-4 md:mt-0 md:ml-4 justify-end">
                                <button onclick="editNotice('${id}', \`${escapeHtml(data.title)}\`, \`${escapeHtml(data.type)}\`, \`${escapeHtml(data.body)}\`, \`${data.severity}\`, \`${escapeHtml(data.link || '')}\`)" class="text-xs bg-blue-950/40 border border-blue-800/60 text-blue-300 px-3 py-1 rounded hover:bg-blue-900/60 transition-all flex items-center gap-1">
                                    <i class="fa-solid fa-pen-to-square"></i> Modifica
                                </button>
                                <button onclick="deleteNotice('${id}')" class="text-xs bg-red-950/40 border border-red-800/60 text-red-300 px-3 py-1 rounded hover:bg-red-900/60 transition-all flex items-center gap-1">
                                    <i class="fa-solid fa-trash"></i> Elimina
                                </button>
                            </div>
                        `;
                    }

                    const noticeHtml = `
                        <div class="glass-panel p-5 rounded-xl border-l-4 ${severityColor} flex flex-col md:flex-row md:items-center justify-between transition-all hover:scale-[1.005]">
                            <div class="space-y-2 flex-1">
                                <div class="flex flex-wrap items-center gap-2">
                                    <span class="text-xs font-mono font-bold px-2.5 py-0.5 rounded ${severityBadge}">${data.severity.toUpperCase()}</span>
                                    <span class="text-xs bg-gray-800 text-blue-400 border border-gray-700 px-2 py-0.5 rounded font-medium">${data.type}</span>
                                    <span class="text-xs text-gray-500 font-mono"><i class="fa-regular fa-clock"></i> ${dateStr} LT</span>
                                </div>
                                <h3 class="text-base font-bold text-white tracking-wide">${data.title}</h3>
                                <p class="text-sm text-gray-300 whitespace-pre-wrap leading-relaxed">${data.body}</p>
                                ${linkButtonHtml}
                            </div>
                            ${adminActions}
                        </div>
                    `;
                    noticesFeed.innerHTML += noticeHtml;
                });
            });
        }

        window.deleteNotice = async function(id) {
            if (confirm("Confermi l'eliminazione definitiva di questo avviso dal network?")) {
                try {
                    await deleteDoc(doc(db, "avvisi", id));
                } catch (error) {
                    alert("Errore nell'eliminazione: " + error.message);
                }
            }
        }

        // Funzione per preparare la modifica (Aggiornata per includere il link)
        window.editNotice = function(id, title, type, body, severity, link) {
            document.getElementById('notice-id').value = id;
            document.getElementById('notice-title').value = title;
            document.getElementById('notice-type').value = type;
            document.getElementById('notice-body').value = body;
            document.getElementById('notice-severity').value = severity;
            document.getElementById('notice-link').value = link === "undefined" ? "" : link;

            btnSubmitNotice.innerText = "Aggiorna Avviso";
            btnSubmitNotice.classList.replace('bg-green-600', 'bg-blue-600');
            btnSubmitNotice.classList.replace('hover:bg-green-700', 'hover:bg-blue-700');
            btnCancelEdit.classList.remove('hidden');
            
            adminPanel.scrollIntoView({ behavior: 'smooth' });
        }

        btnCancelEdit.addEventListener('click', resetForm);

        function resetForm() {
            noticeForm.reset();
            document.getElementById('notice-id').value = "";
            btnSubmitNotice.innerText = "Pubblica Avviso";
            btnSubmitNotice.classList.replace('bg-blue-600', 'bg-green-600');
            btnSubmitNotice.classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
            btnCancelEdit.classList.add('hidden');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
